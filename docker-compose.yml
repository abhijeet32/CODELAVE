version: '3.8'

services:
  server:
    image: node:22-alpine
    container_name: codelave-server
    working_dir: /app
    volumes:
      - ./server:/app
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "3000:3000"
    env_file:
      - .env.example
    command: >
      sh -c "npm install && npm run start:dev"

  client:
    image: node:22-alpine
    container_name: codelave-client
    working_dir: /app
    volumes:
      - ./client:/app
    ports:
      - "4000:3000"
    env_file:
      - .env.example
    command: >
      sh -c "npm install && npm run dev"